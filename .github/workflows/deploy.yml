name: Deploy Salesforce DAB

on:
  # Validate on pull requests to main
  pull_request:
    branches: [main]
  # Deploy to prod on merge to main
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Validate on PR ──────────────────────────────────────────────
  validate:
    name: Validate Bundle
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle (dev target)
        run: databricks bundle validate --strict --target dev

      - name: Validate bundle (staging target)
        run: databricks bundle validate --target staging

      - name: Validate bundle (prod target)
        run: databricks bundle validate --target prod

  # ── Deploy + integration run in staging on merge to main ───────
  deploy-staging:
    name: Deploy to Staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target staging

      - name: Deploy bundle
        run: databricks bundle deploy --target staging

      # End-to-end check: bronze ingestion -> silver + gold. Fails the workflow (and blocks prod) if any task fails.
      - name: Run orchestration job (integration test)
        run: databricks bundle run salesforce_orchestration --target staging

  # ── Deploy to prod after staging succeeds ──────────────────────
  deploy:
    name: Deploy to Production
    if: github.event_name == 'push'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target prod

      - name: Deploy bundle
        run: databricks bundle deploy --target prod