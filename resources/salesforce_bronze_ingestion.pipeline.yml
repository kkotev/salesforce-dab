resources:
  pipelines:
    pipeline_salesforce_bronze_ingestion:
      name: ${var.pipeline_name}_${bundle.target}
      ingestion_definition:
        connection_name: ${var.connection_name}
        objects:
          - table:
              source_schema: objects
              source_table: Account
              destination_catalog: ${var.catalog}
              destination_schema: ${var.bronze_schema}
          - table:
              source_schema: objects
              source_table: Contact
              destination_catalog: ${var.catalog}
              destination_schema: ${var.bronze_schema}
          - table:
              source_schema: objects
              source_table: Lead
              destination_catalog: ${var.catalog}
              destination_schema: ${var.bronze_schema}
          - table:
              source_schema: objects
              source_table: Opportunity
              destination_catalog: ${var.catalog}
              destination_schema: ${var.bronze_schema}
          - table:
              source_schema: objects
              source_table: Case
              destination_catalog: ${var.catalog}
              destination_schema: ${var.bronze_schema}
          - table:
              source_schema: objects
              source_table: Task
              destination_catalog: ${var.catalog}
              destination_schema: ${var.bronze_schema}
        source_type: SALESFORCE
      schema: ${var.bronze_schema}
      channel: CURRENT
      catalog: ${var.catalog}