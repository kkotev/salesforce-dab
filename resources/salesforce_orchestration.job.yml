resources:
  jobs:
    salesforce_orchestration:
      name: salesforce_orchestration_${bundle.target}
      description: Runs Salesforce bronze ingestion, then silver + gold transformations.

      # Daily at 06:00 UTC. pause_status is intentionally omitted: prod defaults to UNPAUSED,
      # dev (development mode) and staging (presets.trigger_pause_status) deploy it PAUSED.
      schedule:
        quartz_cron_expression: '0 0 6 * * ?'
        timezone_id: UTC

      max_concurrent_runs: 1
      timeout_seconds: 7200

      email_notifications:
        on_failure:
          - kotevkostadin97@gmail.com

      tasks:
        - task_key: bronze_ingestion
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_salesforce_bronze_ingestion.id}
            full_refresh: false
          max_retries: 1
          min_retry_interval_millis: 300000

        - task_key: silver_gold_transformations
          depends_on:
            - task_key: bronze_ingestion
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_salesforce_silver.id}
            full_refresh: false
          max_retries: 1
          min_retry_interval_millis: 300000
