bundle:
  name: salesforce-dab

include:
  - resources/*.yml

variables:
  pipeline_name:
    default: salesforce_bronze_ingestion
  catalog:
    default: bronze_salesforce
  schema:
    default: raw_salesforce
  connection_name:
    default: salesforce_connection
  silver_pipeline_name:
    default: salesforce_silver_transformations
  silver_catalog:
    default: silver_salesforce
  silver_schema:
    default: cleaned_salesforce

targets:
  dev:
    mode: development
    variables:
      catalog: bronze_salesforce_dev
      schema: raw_salesforce_dev
      silver_catalog: silver_salesforce_dev
      silver_schema: cleaned_salesforce_dev

  staging:
    mode: production
    variables:
      catalog: bronze_salesforce_staging
      schema: raw_salesforce_staging
      silver_catalog: silver_salesforce_staging
      silver_schema: cleaned_salesforce_staging
    workspace:
      root_path: /Workspace/Shared/.bundle/salesforce-dab/staging

  prod:
    mode: production
    variables:
      catalog: bronze_salesforce
      schema: raw_salesforce
    workspace:
      root_path: /Workspace/Shared/.bundle/salesforce-dab/prod
    permissions:
      - service_principal_name: 758d0780-b2fb-45aa-9ad4-970acb629314
        level: CAN_MANAGE
      - user_name: kotevkostadin97@gmail.com
        level: CAN_MANAGE
