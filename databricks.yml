bundle:
  name: salesforce-dab

include:
  - resources/*.yml

variables:
  pipeline_name:
    default: salesforce_bronze_ingestion
  # One catalog per environment; one schema per medallion layer
  catalog:
    description: Environment catalog (salesforce_dev / salesforce_staging / salesforce_prod)
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  connection_name:
    default: salesforce_connection
  silver_pipeline_name:
    default: salesforce_silver_transformations

targets:
  dev:
    mode: development
    variables:
      catalog: salesforce_dev

  staging:
    mode: production
    variables:
      catalog: salesforce_staging
    workspace:
      root_path: /Workspace/Shared/.bundle/salesforce-dab/staging
    # Staging runs only when CI triggers it (integration test), not on the daily schedule
    presets:
      trigger_pause_status: PAUSED

  prod:
    mode: production
    variables:
      catalog: salesforce_prod
    workspace:
      root_path: /Workspace/Shared/.bundle/salesforce-dab/prod
    permissions:
      - service_principal_name: 758d0780-b2fb-45aa-9ad4-970acb629314
        level: CAN_MANAGE
      - user_name: kotevkostadin97@gmail.com
        level: CAN_MANAGE
