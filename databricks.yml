bundle:
  name: salesforce-dab

include:
  - resources/*.yml

permissions:                          
  - user_name: kkotev@deloittece.com 
    level: CAN_MANAGE 

variables:
  pipeline_name:
    default: salesforce_bronze_ingestion
  catalog:
    default: bronze_salesforce
  schema:
    default: raw_salesforce
  connection_name:
    default: salesforce_ingestion

targets:
  dev:
    mode: development
    variables:
      catalog: bronze_salesforce_dev
      schema: raw_salesforce_dev

  staging:
    mode: production
    variables:
      catalog: bronze_salesforce_staging
      schema: raw_salesforce_staging
    workspace:
      root_path: /Workspace/Users/kkotev@deloittece.com/.bundle/salesforce-dab/staging

  prod:
    mode: production
    variables:
      catalog: bronze_salesforce
      schema: raw_salesforce
    workspace:
      root_path: /Workspace/Users/kkotev@deloittece.com/.bundle/salesforce-dab/prod
    permissions:
      - user_name: data_engineering@company.com
        level: CAN_MANAGE
      - group_name: analysts
        level: CAN_VIEW
